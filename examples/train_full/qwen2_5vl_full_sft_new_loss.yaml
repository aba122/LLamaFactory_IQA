### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json
use_iqa_no_anchor_loss: true
iqa_loss_step: 0.05  # switch to 0.01 in later epochs if needed
iqa_loss_sigma: 0.15
iqa_loss_delta: 0.1
iqa_loss_kl_weight: 0.7
iqa_loss_reg_weight: 0.3

### dataset
dataset: Q-insight_CoT_GPT4_v3_Reflection_SFT
template: qwen2_vl
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen2_5vl-7b/full/sft_new_loss
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.06
bf16: true
gradient_checkpointing: true
max_grad_norm: 1.0
ddp_timeout: 180000000
resume_from_checkpoint: null
load_best_model_at_end: true
metric_for_best_model: eval_loss
early_stopping_steps: 400
save_total_limit: 2

### eval
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
